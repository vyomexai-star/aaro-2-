kind = "web"
previewPath = "/"
title = "Aaro Farms"
description = "A responsive, editorial-style website for Aaro Farms, a healthy and convenient food brand. Product and business details are clearly marked as placeholders until verified information is supplied."
version = "1.0.0"
id = "artifacts/site-starter"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20667

[services.development]
run = "pnpm --filter @workspace/site-starter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/site-starter", "run", "build" ]
serve = "static"
publicDir = "artifacts/site-starter/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20667"
BASE_PATH = "/"
